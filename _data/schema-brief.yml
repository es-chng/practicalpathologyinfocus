# Article schema: "brief", a short evidence brief.
#
# An article schema builds on the base schema (the fields every article has:
# title, authors, volume, issue, licence, ...) and adds the fields of one
# article type, in the order they appear on the web page and in the PDF.
# Articles refer to it by file name:
#   schema: schema-brief
#
# Each field needs these field attributes:
#   key         the name used in the article's front matter
#   label       the heading readers see
#   shape       text | list | table | boolean | date
#
# Add these field attributes only when needed:
#   style       boxed | opinion | badge    (default: plain; tables: table)
#               numbered                   (list fields only: 1. 2. 3.)
#   visibility  editor                     (default: public; editor = never shown)
#   optional    true                       (default: required)
#   teaser      true                       (exactly one field: shown in listings)
#   max_chars   a number                   (length limit, checked before every build)
#   columns     [a, b, c]                  (table fields: column keys, in order)
#
# Once an article using this article schema is published, it is locked.
# To change it later, copy it to a new file (schema-brief-v2.yml, version: 2).

version: 1

fields:
  - key: article_type
    label: "Article type"
    shape: text
    style: badge

  - key: question
    label: "Question"
    shape: text
    style: boxed

  - key: background
    label: "Background"
    shape: text

  - key: evidence
    label: "Evidence"
    shape: table
    columns: ["source", "finding", "limitation"]

  - key: recommendations
    label: "Recommendations"
    shape: list
    style: boxed

  - key: open_questions
    label: "Open questions"
    shape: list
    optional: true

  - key: perspective
    label: "Personal perspective"
    shape: text
    style: opinion
    optional: true

  - key: bottom_line
    label: "Bottom line"
    shape: text
    style: boxed
    teaser: true
    max_chars: 300

  - key: conflicts_declared
    label: "Conflicts of interest declared"
    shape: boolean

  - key: last_reviewed
    label: "Evidence reviewed on"
    shape: date

  - key: references
    label: "References"
    shape: list
    style: numbered

  - key: editorial_note
    label: "Editorial note"
    shape: text
    visibility: editor
    optional: true
