version: 1
article_type: educational_review

structure:
  - question
  - background
  - sections
  - bottom_line

blocks:

  question:
    label: "Question"
    shape: text
    style: boxed

  background:
    label: "Background"
    shape: text

  sections:
    label: "Sections"
    shape: repeat
    item_order:
      - question
      - text
      - tables
      - bottom_line
    item:
      question:
        label: "Question"
        shape: text
        style: boxed
        optional: true
      text:
        label: "Text"
        shape: text
      tables:
        label: "Tables"
        shape: list
        optional: true
        item:
          shape: table
          columns: dynamic
      bottom_line:
        label: "Bottom line"
        shape: text
        style: boxed
        max_chars: 300

  bottom_line:
    label: "Bottom line"
    shape: text
    style: boxed
    teaser: true
