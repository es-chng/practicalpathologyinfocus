name: Set up Python, fonts, and dependencies
description: >
  Shared setup used by both pages.yml and zenodo-articles.yml: Python,
  the project's Python dependencies, and the font family the PDF renderer
  needs. Kept as one composite action specifically so a fix like a font
  package rename only ever needs to be made in one place -- the exact
  class of drift that previously required editing both workflow files
  identically by hand.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Install fonts used by the PDF renderer
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu
