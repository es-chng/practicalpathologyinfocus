<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.collection == "issues" %}Volume {{ page.volume }}, Issue {{ page.issue }} · {% elsif page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/pdf.css' | relative_url }}?v={{ site.time | date: '%s' }}" media="print">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Site">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/issues/' | relative_url }}">Issues</a>
    </nav>
  </div>
</header>
{{ content }}
</body>
</html>
